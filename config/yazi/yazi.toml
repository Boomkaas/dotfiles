# ==============================================================================
#                      HAKUSPACE / NIXOS YAZI CONFIGURATION
# ==============================================================================

[mgr]
ratio          = [ 1, 4, 3 ]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5

[preview]
tab_size        = 2
max_width       = 600
max_height      = 400
image_filter    = "triangle"
image_quality   = 75
sixel_fraction  = 15

[opener]
edit = [
	{ run = 'zeditor "$@"', orphan = true, desc = "Zed" },
]
open = [
	{ run = 'xdg-open "$@"', desc = "Default App" },
]
video = [
	{ run = 'vlc "$@"', orphan = true, desc = "VLC Media Player" },
]
image = [
	{ run = 'xdg-open "$@"', orphan = true, desc = "Image Viewer" },
]
terminal = [
	{ run = 'kitty --directory "$@"', orphan = true, desc = "Kitty Terminal" },
]

[open]
rules = [
	{ name = "*/", use = [ "edit", "open" ] },
	{ mime = "text/*", use = [ "edit", "open" ] },
	{ mime = "image/*", use = [ "image", "open" ] },
	{ mime = "video/*", use = [ "video", "open" ] },
	{ mime = "audio/*", use = [ "video", "open" ] },
	{ mime = "application/json", use = [ "edit", "open" ] },
	{ mime = "application/javascript", use = [ "edit", "open" ] },
	{ mime = "application/pdf", use = [ "open" ] },
	{ mime = "*", use = [ "open", "edit" ] },
]
