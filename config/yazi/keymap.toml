# ==============================================================================
#                      HAKUSPACE / NIXOS YAZI KEYMAP
# ==============================================================================

[mgr]
prepend_keymap = [
	# Quick Editor & Interactive Open
	{ on = "e", run = "edit", desc = "Edit file in $EDITOR" },
	{ on = "E", run = "open --interactive", desc = "Open with interactive menu" },

	# Path copying to Wayland clipboard
	{ on = [ "y", "p" ], run = "copy path", desc = "Copy absolute path to clipboard" },
	{ on = [ "y", "d" ], run = "copy dirname", desc = "Copy parent directory path" },
	{ on = [ "y", "f" ], run = "copy filename", desc = "Copy file name" },

	# Quick Directory Jumps
	{ on = [ "g", "h" ], run = "cd ~", desc = "Go to Home (~)" },
	{ on = [ "g", "c" ], run = "cd ~/Code/Dotfiles", desc = "Go to Dotfiles" },
	{ on = [ "g", "d" ], run = "cd ~/Downloads", desc = "Go to Downloads" },
	{ on = [ "g", "D" ], run = "cd ~/Documents", desc = "Go to Documents" },
	{ on = [ "g", "p" ], run = "cd ~/Pictures", desc = "Go to Pictures" },
	{ on = [ "g", "v" ], run = "cd ~/Code/Vault", desc = "Go to Vault" },

	# Terminal Spawners
	{ on = "t", run = 'shell "$SHELL" --block', desc = "Open shell in current directory" },
	{ on = "T", run = 'shell "kitty --directory ." --orphan', desc = "Spawn Kitty terminal" },
]
