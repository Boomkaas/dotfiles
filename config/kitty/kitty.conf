# Black-and-white look (matches niri-creation-of-adam)
background #030303
foreground #E0E0E0
background_opacity 0.9

# 9pt = 12px at 96 dpi
window_padding_width 9

# niri draws no decorations (prefer-no-csd); keep kitty from adding its own
hide_window_decorations yes
confirm_os_window_close 0

font_family JetBrainsMono Nerd Font
font_size   12

cursor_shape beam
mouse_hide_wait 3.0
scrollback_lines 5000

map ctrl+shift+t new_tab_with_cwd
