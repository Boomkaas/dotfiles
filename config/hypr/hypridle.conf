general {
    lock_cmd = pidof hyprlock || /run/current-system/sw/bin/bash ~/.local/bin/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = /run/current-system/sw/bin/bash ~/.local/bin/dpms_handler.sh on
    # ignore_dbus_inhibit and ignore_systemd_inhibit removed:
    # they were causing locks/sleeps during video, games, and app installs.
    # idle_inhibit.sh handles caffeine mode independently via state file.
}

# ==============================================================================
# ON BATTERY (NOT CHARGING)
# ==============================================================================

# Lock screen after 2 minutes (120s) on battery
listener {
    timeout = 120
    on-timeout = /run/current-system/sw/bin/bash ~/.local/bin/idle_inhibit.sh --battery && loginctl lock-session
}

# Turn off display (DPMS) after 3 minutes (180s) on battery
listener {
    timeout = 180
    on-timeout = /run/current-system/sw/bin/bash ~/.local/bin/idle_inhibit.sh --battery && /run/current-system/sw/bin/bash ~/.local/bin/dpms_handler.sh off
    on-resume = /run/current-system/sw/bin/bash ~/.local/bin/dpms_handler.sh on
}

# Go to sleep (suspend) after 5 minutes (300s) on battery with RTC wake timer for 1h poweroff
listener {
    timeout = 300
    on-timeout = /run/current-system/sw/bin/bash ~/.local/bin/idle_sleep_poweroff.sh --battery
}

# Fallback shutdown after 1 hour (3600s) on battery (if sleep was inhibited)
listener {
    timeout = 3600
    on-timeout = /run/current-system/sw/bin/bash ~/.local/bin/idle_inhibit.sh --battery && systemctl poweroff
}

# ==============================================================================
# ON AC / CHARGING
# ==============================================================================

# Lock screen after 3 minutes (180s) on AC
listener {
    timeout = 180
    on-timeout = /run/current-system/sw/bin/bash ~/.local/bin/idle_inhibit.sh --ac && loginctl lock-session
}

# Turn off display (DPMS) after 10 minutes (600s) on AC
listener {
    timeout = 600
    on-timeout = /run/current-system/sw/bin/bash ~/.local/bin/idle_inhibit.sh --ac && /run/current-system/sw/bin/bash ~/.local/bin/dpms_handler.sh off
    on-resume = /run/current-system/sw/bin/bash ~/.local/bin/dpms_handler.sh on
}

# Go to sleep (suspend) after 20 minutes (1200s) on AC with RTC wake timer for 3h poweroff
listener {
    timeout = 1200
    on-timeout = /run/current-system/sw/bin/bash ~/.local/bin/idle_sleep_poweroff.sh --ac
}

# Fallback shutdown after 3 hours (10800s) on AC (if sleep was inhibited)
listener {
    timeout = 10800
    on-timeout = /run/current-system/sw/bin/bash ~/.local/bin/idle_inhibit.sh --ac && systemctl poweroff
}
