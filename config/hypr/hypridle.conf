general {
    lock_cmd = pidof hyprlock || ~/.local/bin/lock.sh
    before_sleep_cmd = loginctl lock-session && ~/.local/bin/dpms_handler.sh off
    after_sleep_cmd = ~/.local/bin/dpms_handler.sh on
}

# ==============================================================================
# ON BATTERY (NOT CHARGING)
# ==============================================================================

# Lock screen after 2 minutes (120s) on battery
listener {
    timeout = 120
    on-timeout = ~/.local/bin/idle_inhibit.sh --battery && loginctl lock-session
}

# Turn off display (DPMS) after 3 minutes (180s) on battery
listener {
    timeout = 180
    on-timeout = ~/.local/bin/idle_inhibit.sh --battery && ~/.local/bin/dpms_handler.sh off
    on-resume = ~/.local/bin/dpms_handler.sh on
}

# Go to sleep (suspend) after 5 minutes (300s) on battery
listener {
    timeout = 300
    on-timeout = ~/.local/bin/idle_inhibit.sh --battery && systemctl suspend
}

# Shutdown after 1 hour (3600s) on battery
listener {
    timeout = 3600
    on-timeout = ~/.local/bin/idle_inhibit.sh --battery && systemctl poweroff
}

# ==============================================================================
# ON AC / CHARGING
# ==============================================================================

# Lock screen after 3 minutes (180s) on AC
listener {
    timeout = 180
    on-timeout = ~/.local/bin/idle_inhibit.sh --ac && loginctl lock-session
}

# Turn off display (DPMS) after 10 minutes (600s) on AC
listener {
    timeout = 600
    on-timeout = ~/.local/bin/idle_inhibit.sh --ac && ~/.local/bin/dpms_handler.sh off
    on-resume = ~/.local/bin/dpms_handler.sh on
}

# Go to sleep (suspend) after 20 minutes (1200s) on AC
listener {
    timeout = 1200
    on-timeout = ~/.local/bin/idle_inhibit.sh --ac && systemctl suspend
}

# Shutdown after 3 hours (10800s) on AC
listener {
    timeout = 10800
    on-timeout = ~/.local/bin/idle_inhibit.sh --ac && systemctl poweroff
}
