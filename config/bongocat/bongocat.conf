# Bongo Cat / Wayland Virtual Pets Configuration
# Save location: ~/.config/bongocat/bongocat.conf

# Overlay Settings
overlay_height=120
overlay_position=bottom
overlay_opacity=0
overlay_layer=overlay

# Alignment & Positioning (Center Origin for Full-Screen Width Roaming)
cat_align=center
cat_x_offset=0
cat_y_offset=0

# Size & Rendering
cat_height=100
enable_antialiasing=1

# Character Selection (Pokemon / Digimon / Custom Sprite Sheet)
animation_name=Dodomon
random=0
random_on_reload=0

# Evolution / Growth Settings (Disabled)
evolution=none

# ==============================================================================
# ANIMATIONS & BEHAVIORS CONFIGURATION
# ==============================================================================

# 1. Idle Pose & 2. Boring Animation (Inactivity Emotes)
# Idle -- Idle Pose
# Boring -- Periodic emote (yawning, sitting, looking around) triggered during pauses
idle_animation=1
idle_frame=1
animation_speed=130
fps=60
test_animation_interval=8
test_animation_duration=6

# 3. StartWriting, 4. Writing & 5. EndWriting (Typing Reaction Loop)
# StartWriting -- First keystroke triggers transition
# Writing -- Typing loop while keys are pressed
# EndWriting -- Smooth return to Idle pose after last keystroke
enable_hand_mapping=1

# 6. Happy Animation (High Speed Typing)
# Happy -- Cheerful / joyful emote when target KPM is reached while writing
happy_kpm=50

# 7. ASleep, 8. Sleep & 9. WakeUp (Inactivity Sleep Cycle)
# ASleep -- Falling asleep transition
# Sleep -- Sleeping / resting loop
# WakeUp -- Waking up on input and returning to Idle
idle_sleep_timeout=40
enable_scheduled_sleep=0

# 10. StartWorking, 11. Working & 12. EndWorking (CPU Load Reaction)
# StartWorking -- Spikes in CPU usage trigger work transition
# Working -- Active work animation when CPU load exceeds threshold
# EndWorking -- Returns to normal state when CPU usage drops
cpu_threshold=25

# 13. StartMoving, 14. Moving & 15. EndMoving (Walking & Roaming)
# StartMoving -- Start walking across screen
# Moving -- Walking loop across bottom of screen
# EndMoving -- Stops moving and settles into Idle
movement_radius=950
movement_speed=4
movement_wait_factor=1.6

# 16. StartRunning, 17. Running & 18. EndRunning (High Speed Movement Under Load)
# StartRunning -- Bursts of speed when CPU load or activity is high
# Running -- Fast movement loop
# EndRunning -- Slows down back to walking / idle
cpu_running_factor=1.5

# Input Devices (Monitors Keyboard, Mouse Moves & Clicks for Typing & Wake-Up)
keyboard_device=/dev/input/by-path/platform-i8042-serio-0-event-kbd
keyboard_device=/dev/input/by-path/pci-0000:00:14.0-usb-0:2:1.0-event-kbd
keyboard_device=/dev/input/by-path/pci-0000:00:14.0-usb-0:2:1.1-event-mouse
keyboard_device=/dev/input/by-path/pci-0000:00:15.1-platform-i2c_designware.1-event-mouse
