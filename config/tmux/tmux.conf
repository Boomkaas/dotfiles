# ==============================================================================
#                      HAKUSPACE / NIXOS TMUX CONFIGURATION
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. PREFIX BINDINGS (Ctrl-a ergonomic primary with Ctrl-b fallback)
# ------------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix
set -g prefix2 C-b
bind-key C-b send-prefix -2

# ------------------------------------------------------------------------------
# 2. GENERAL SETTINGS
# ------------------------------------------------------------------------------
# Enable mouse support (clickable panes, windows, draggable resizes, scrolling)
set -g mouse on

# Allow terminal escape passthrough (critical for Yazi image preview in Kitty)
set -g allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Zero delay for ESC key (critical for fast modal-app key handling)
set -s escape-time 0

# Scrollback history buffer size
set -g history-limit 50000

# Message display timeout (3 seconds)
set -g display-time 3000

# Refresh status line every 3 seconds
set -g status-interval 3

# Focus events for modern terminals
set -g focus-events on

# 24-bit RGB True Color, Kitty extended keyboard protocol, and 256 color support
set -g default-terminal "tmux-256color"
set -s extended-keys on
set -as terminal-features ",xterm-256color:RGB:extkeys"
set -as terminal-features ",xterm-kitty:RGB:hyperlinks:sixel:clipboard:extkeys"
set -as terminal-overrides ",xterm*:Tc"

# Set default shell to fish if available
set -g default-shell "/run/current-system/sw/bin/fish"

# ------------------------------------------------------------------------------
# 3. WINDOW & PANE INDEXING (1-indexed for ergonomic number-row reach)
# ------------------------------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
# Keep fixed window slot numbers (disables automatic gap-collapsing so workspace slots persist)
set -g renumber-windows off

# ------------------------------------------------------------------------------
# 4. INTUITIVE SPLITS & CREATION (in current working directory)
# ------------------------------------------------------------------------------
# Vertical split (left / right) with | or \
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"

# Horizontal split (top / bottom) with - or _
unbind '"'
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# Create new window in current path
bind c new-window -c "#{pane_current_path}"

# ------------------------------------------------------------------------------
# 5. FAST PANE NAVIGATION (Alt + Arrows or Alt + hjkl WITHOUT PREFIX)
# ------------------------------------------------------------------------------
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Prefix + hjkl pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ------------------------------------------------------------------------------
# 6. PANE RESIZING & ZOOM
# ------------------------------------------------------------------------------
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Toggle pane maximize / zoom with 'm' or 'z'
bind m resize-pane -Z

# Kill active pane with confirmation prompt
bind x confirm-before -p "Kill pane #P? (y/n)" kill-pane

# ------------------------------------------------------------------------------
# 7. FAST WINDOW SWITCHING, CREATION & RELOCATION (Alt / Shift+Alt + 0..9)
# ------------------------------------------------------------------------------
# Alt + 0..9: Switch to window, or create a new window if one doesn't exist on that number
bind -n M-1 if-shell "tmux select-window -t :1" "" "new-window -t :1 -c '#{pane_current_path}'"
bind -n M-2 if-shell "tmux select-window -t :2" "" "new-window -t :2 -c '#{pane_current_path}'"
bind -n M-3 if-shell "tmux select-window -t :3" "" "new-window -t :3 -c '#{pane_current_path}'"
bind -n M-4 if-shell "tmux select-window -t :4" "" "new-window -t :4 -c '#{pane_current_path}'"
bind -n M-5 if-shell "tmux select-window -t :5" "" "new-window -t :5 -c '#{pane_current_path}'"
bind -n M-6 if-shell "tmux select-window -t :6" "" "new-window -t :6 -c '#{pane_current_path}'"
bind -n M-7 if-shell "tmux select-window -t :7" "" "new-window -t :7 -c '#{pane_current_path}'"
bind -n M-8 if-shell "tmux select-window -t :8" "" "new-window -t :8 -c '#{pane_current_path}'"
bind -n M-9 if-shell "tmux select-window -t :9" "" "new-window -t :9 -c '#{pane_current_path}'"
bind -n M-0 if-shell "tmux select-window -t :0" "" "new-window -t :0 -c '#{pane_current_path}'"

# Shift + Alt + 0..9: Move current window to that number if unoccupied
bind -n "M-!" if-shell -F "#{!=:#{window_index},1}" "move-window -t :1"
bind -n "M-@" if-shell -F "#{!=:#{window_index},2}" "move-window -t :2"
bind -n "M-#" if-shell -F "#{!=:#{window_index},3}" "move-window -t :3"
bind -n "M-$" if-shell -F "#{!=:#{window_index},4}" "move-window -t :4"
bind -n "M-%" if-shell -F "#{!=:#{window_index},5}" "move-window -t :5"
bind -n "M-^" if-shell -F "#{!=:#{window_index},6}" "move-window -t :6"
bind -n "M-&" if-shell -F "#{!=:#{window_index},7}" "move-window -t :7"
bind -n "M-*" if-shell -F "#{!=:#{window_index},8}" "move-window -t :8"
bind -n "M-(" if-shell -F "#{!=:#{window_index},9}" "move-window -t :9"
bind -n "M-)" if-shell -F "#{!=:#{window_index},0}" "move-window -t :0"

# Extended keys / kitty keyboard protocol support for Shift + Alt + 0..9
bind -n M-S-1 if-shell -F "#{!=:#{window_index},1}" "move-window -t :1"
bind -n M-S-2 if-shell -F "#{!=:#{window_index},2}" "move-window -t :2"
bind -n M-S-3 if-shell -F "#{!=:#{window_index},3}" "move-window -t :3"
bind -n M-S-4 if-shell -F "#{!=:#{window_index},4}" "move-window -t :4"
bind -n M-S-5 if-shell -F "#{!=:#{window_index},5}" "move-window -t :5"
bind -n M-S-6 if-shell -F "#{!=:#{window_index},6}" "move-window -t :6"
bind -n M-S-7 if-shell -F "#{!=:#{window_index},7}" "move-window -t :7"
bind -n M-S-8 if-shell -F "#{!=:#{window_index},8}" "move-window -t :8"
bind -n M-S-9 if-shell -F "#{!=:#{window_index},9}" "move-window -t :9"
bind -n M-S-0 if-shell -F "#{!=:#{window_index},0}" "move-window -t :0"

# Cycle windows with Shift + Left/Right
bind -n S-Left  previous-window
bind -n S-Right next-window

# Prefix + Tab to toggle to last active window
bind Tab last-window

# ------------------------------------------------------------------------------
# 8. COPY MODE & WAYLAND CLIPBOARD (Vi style)
# ------------------------------------------------------------------------------
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind ] run "wl-paste -n | tmux load-buffer - && tmux paste-buffer"

# ------------------------------------------------------------------------------
# 9. UTILITIES
# ------------------------------------------------------------------------------
# Prefix + r: Reload configuration with notification
bind r source-file ~/.config/tmux/tmux.conf \; display-message " ✨ Tmux configuration reloaded!"

# ------------------------------------------------------------------------------
# 10. AESTHETICS & STATUS BAR (Gruvbox Dark / Glassmorphic)
# ------------------------------------------------------------------------------
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e1e1e,fg=#ebdbb2"

# Pane border styling
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#d79921"

# Left Status: Session badge
set -g status-left-length 40
set -g status-left "#[bg=#d79921,fg=#1d2021,bold]  #S #[bg=#1e1e1e,fg=#d79921] "

# Right Status: Directory, time, date, helper hint
set -g status-right-length 80
set -g status-right "#[fg=#928374]Prefix: C-a | #[fg=#83a598] #{b:pane_current_path} #[fg=#504945]| #[fg=#b8bb26] %H:%M #[fg=#ebdbb2,bg=#3c3836]  %d-%b #[default]"

# Window tabs styling
set -g window-status-separator " "
set -g window-status-format "#[fg=#a89984,bg=#282828] #I:#W #[default]"
set -g window-status-current-format "#[bg=#458588,fg=#1d2021,bold] #I:#W* #[default]"
