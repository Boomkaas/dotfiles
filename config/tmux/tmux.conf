# ==============================================================================
#                      HAKUSPACE / NIXOS TMUX CONFIGURATION
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. PREFIX BINDINGS (Ctrl-a ergonomic primary with Ctrl-b fallback)
# ------------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix
set -g prefix2 C-b
bind-key C-b send-prefix -2

# ------------------------------------------------------------------------------
# 2. GENERAL SETTINGS
# ------------------------------------------------------------------------------
# Enable mouse support (clickable panes, windows, draggable resizes, scrolling)
set -g mouse on

# Allow terminal escape passthrough (critical for Yazi image preview in Kitty)
set -g allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Zero delay for ESC key (critical for fast Neovim / Helix mode switching)
set -s escape-time 0

# Scrollback history buffer size
set -g history-limit 50000

# Message display timeout (3 seconds)
set -g display-time 3000

# Refresh status line every 3 seconds
set -g status-interval 3

# Focus events for modern terminals
set -g focus-events on

# 24-bit RGB True Color and 256 color terminal support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-kitty:RGB:hyperlinks:sixel:clipboard"
set -as terminal-overrides ",xterm*:Tc"

# Set default shell to fish if available
set -g default-shell "/run/current-system/sw/bin/fish"

# ------------------------------------------------------------------------------
# 3. WINDOW & PANE INDEXING (1-indexed for ergonomic number-row reach)
# ------------------------------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ------------------------------------------------------------------------------
# 4. INTUITIVE SPLITS & CREATION (in current working directory)
# ------------------------------------------------------------------------------
# Vertical split (left / right) with | or \
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"

# Horizontal split (top / bottom) with - or _
unbind '"'
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# Create new window in current path
bind c new-window -c "#{pane_current_path}"

# ------------------------------------------------------------------------------
# 5. FAST PANE NAVIGATION (Alt + Arrows or Alt + hjkl WITHOUT PREFIX)
# ------------------------------------------------------------------------------
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Prefix + hjkl pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ------------------------------------------------------------------------------
# 6. PANE RESIZING & ZOOM
# ------------------------------------------------------------------------------
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Toggle pane maximize / zoom with 'm' or 'z'
bind m resize-pane -Z

# Kill active pane with confirmation prompt
bind x confirm-before -p "Kill pane #P? (y/n)" kill-pane

# ------------------------------------------------------------------------------
# 7. FAST WINDOW SWITCHING & CYCLING
# ------------------------------------------------------------------------------
# Switch to window 1..9 directly with Alt + 1..9 (no prefix needed!)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Cycle windows with Shift + Left/Right
bind -n S-Left  previous-window
bind -n S-Right next-window

# Prefix + Tab to toggle to last active window
bind Tab last-window

# ------------------------------------------------------------------------------
# 8. COPY MODE & WAYLAND CLIPBOARD (Vi style)
# ------------------------------------------------------------------------------
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind ] run "wl-paste -n | tmux load-buffer - && tmux paste-buffer"

# ------------------------------------------------------------------------------
# 9. FLOATING POPUPS & UTILITIES
# ------------------------------------------------------------------------------
# Prefix + y: Open Yazi file manager in a floating popup in current directory!
bind y display-popup -w 85% -h 85% -d "#{pane_current_path}" -E "yazi"

# Prefix + r: Reload configuration with notification
bind r source-file ~/.config/tmux/tmux.conf \; display-message " ✨ Tmux configuration reloaded!"

# F1: Interactive Hotkey Cheat Sheet modal popup (direct F1, Prefix + F1, and Prefix + /)
bind -n F1 display-popup -w 85% -h 85% -E "/home/peng/Code/Dotfiles/config/tmux/cheatsheet.sh"
bind F1 display-popup -w 85% -h 85% -E "/home/peng/Code/Dotfiles/config/tmux/cheatsheet.sh"
bind / display-popup -w 85% -h 85% -E "/home/peng/Code/Dotfiles/config/tmux/cheatsheet.sh"
bind ? display-popup -w 85% -h 85% -E "/home/peng/Code/Dotfiles/config/tmux/cheatsheet.sh"

# ------------------------------------------------------------------------------
# 10. AESTHETICS & STATUS BAR (Gruvbox Dark / Glassmorphic)
# ------------------------------------------------------------------------------
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e1e1e,fg=#ebdbb2"

# Pane border styling
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#d79921"

# Left Status: Session badge
set -g status-left-length 40
set -g status-left "#[bg=#d79921,fg=#1d2021,bold]  #S #[bg=#1e1e1e,fg=#d79921] "

# Right Status: Directory, time, date, helper hint
set -g status-right-length 80
set -g status-right "#[fg=#928374]Prefix: C-a | #[fg=#83a598] #{b:pane_current_path} #[fg=#504945]| #[fg=#b8bb26] %H:%M #[fg=#ebdbb2,bg=#3c3836]  %d-%b #[default]"

# Window tabs styling
set -g window-status-separator " "
set -g window-status-format "#[fg=#a89984,bg=#282828] #I:#W #[default]"
set -g window-status-current-format "#[bg=#458588,fg=#1d2021,bold] #I:#W* #[default]"
