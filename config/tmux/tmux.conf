# Match kitty: true color, kitty's own colors, fish shell
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:RGB"
set -g default-shell /run/current-system/sw/bin/fish
set -g mouse on
set -sg escape-time 0
set -g focus-events on
set -g extended-keys on

# Black status bar, no bright backgrounds
set -g status-style "bg=black,fg=colour244"
set -g status-left ""
set -g status-right "#[fg=colour244]#(cat /sys/class/power_supply/BAT0/capacity)%% %H:%M "
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "bg=black,fg=white,bold"
set -g window-status-style "bg=black,fg=colour244"
set -g message-style "bg=black,fg=white"
set -g message-command-style "bg=black,fg=white"
set -g mode-style "bg=colour238,fg=white"

# Quiet pane borders
set -g pane-border-style "fg=colour236"
set -g pane-active-border-style "fg=colour240"

# Ctrl+N: go to window N (create if missing); Ctrl+Shift+N: move current window to N (swap if taken)
set -s user-keys[0] "\e[900~"
set -s user-keys[1] "\e[910~"
bind -n User0 run 'tmux select-window -t :0 2>/dev/null || tmux new-window -t :0 -c "#{pane_current_path}"'
bind -n User1 run 'tmux swap-window -d -t :0 2>/dev/null || tmux move-window -t :0'
set -s user-keys[2] "\e[901~"
set -s user-keys[3] "\e[911~"
bind -n User2 run 'tmux select-window -t :1 2>/dev/null || tmux new-window -t :1 -c "#{pane_current_path}"'
bind -n User3 run 'tmux swap-window -d -t :1 2>/dev/null || tmux move-window -t :1'
set -s user-keys[4] "\e[902~"
set -s user-keys[5] "\e[912~"
bind -n User4 run 'tmux select-window -t :2 2>/dev/null || tmux new-window -t :2 -c "#{pane_current_path}"'
bind -n User5 run 'tmux swap-window -d -t :2 2>/dev/null || tmux move-window -t :2'
set -s user-keys[6] "\e[903~"
set -s user-keys[7] "\e[913~"
bind -n User6 run 'tmux select-window -t :3 2>/dev/null || tmux new-window -t :3 -c "#{pane_current_path}"'
bind -n User7 run 'tmux swap-window -d -t :3 2>/dev/null || tmux move-window -t :3'
set -s user-keys[8] "\e[904~"
set -s user-keys[9] "\e[914~"
bind -n User8 run 'tmux select-window -t :4 2>/dev/null || tmux new-window -t :4 -c "#{pane_current_path}"'
bind -n User9 run 'tmux swap-window -d -t :4 2>/dev/null || tmux move-window -t :4'
set -s user-keys[10] "\e[905~"
set -s user-keys[11] "\e[915~"
bind -n User10 run 'tmux select-window -t :5 2>/dev/null || tmux new-window -t :5 -c "#{pane_current_path}"'
bind -n User11 run 'tmux swap-window -d -t :5 2>/dev/null || tmux move-window -t :5'
set -s user-keys[12] "\e[906~"
set -s user-keys[13] "\e[916~"
bind -n User12 run 'tmux select-window -t :6 2>/dev/null || tmux new-window -t :6 -c "#{pane_current_path}"'
bind -n User13 run 'tmux swap-window -d -t :6 2>/dev/null || tmux move-window -t :6'
set -s user-keys[14] "\e[907~"
set -s user-keys[15] "\e[917~"
bind -n User14 run 'tmux select-window -t :7 2>/dev/null || tmux new-window -t :7 -c "#{pane_current_path}"'
bind -n User15 run 'tmux swap-window -d -t :7 2>/dev/null || tmux move-window -t :7'
set -s user-keys[16] "\e[908~"
set -s user-keys[17] "\e[918~"
bind -n User16 run 'tmux select-window -t :8 2>/dev/null || tmux new-window -t :8 -c "#{pane_current_path}"'
bind -n User17 run 'tmux swap-window -d -t :8 2>/dev/null || tmux move-window -t :8'
set -s user-keys[18] "\e[909~"
set -s user-keys[19] "\e[919~"
bind -n User18 run 'tmux select-window -t :9 2>/dev/null || tmux new-window -t :9 -c "#{pane_current_path}"'
bind -n User19 run 'tmux swap-window -d -t :9 2>/dev/null || tmux move-window -t :9'

# Pass kitty's true colors and env through to programs in tmux
set -as terminal-features ",xterm-kitty:RGB"
set -g update-environment "COLORTERM TERM_PROGRAM KITTY_WINDOW_ID"
set -g allow-passthrough on
setenv -g COLORTERM truecolor
setenv -g CLAUDE_CODE_TMUX_TRUECOLOR 1

# 5. FAST PANE NAVIGATION (Alt + Arrows or Alt + hjkl WITHOUT PREFIX)
# ------------------------------------------------------------------------------
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# 7. FAST WINDOW SWITCHING, CREATION & RELOCATION (Alt / Shift+Alt + 0..9)
# ------------------------------------------------------------------------------
# Alt + 0..9: Switch to window, or create a new window if one doesn't exist on that number
bind -n M-1 if-shell "tmux select-window -t :1" "" "new-window -t :1 -c '#{pane_current_path}'"
bind -n M-2 if-shell "tmux select-window -t :2" "" "new-window -t :2 -c '#{pane_current_path}'"
bind -n M-3 if-shell "tmux select-window -t :3" "" "new-window -t :3 -c '#{pane_current_path}'"
bind -n M-4 if-shell "tmux select-window -t :4" "" "new-window -t :4 -c '#{pane_current_path}'"
bind -n M-5 if-shell "tmux select-window -t :5" "" "new-window -t :5 -c '#{pane_current_path}'"
bind -n M-6 if-shell "tmux select-window -t :6" "" "new-window -t :6 -c '#{pane_current_path}'"
bind -n M-7 if-shell "tmux select-window -t :7" "" "new-window -t :7 -c '#{pane_current_path}'"
bind -n M-8 if-shell "tmux select-window -t :8" "" "new-window -t :8 -c '#{pane_current_path}'"
bind -n M-9 if-shell "tmux select-window -t :9" "" "new-window -t :9 -c '#{pane_current_path}'"
bind -n M-0 if-shell "tmux select-window -t :0" "" "new-window -t :0 -c '#{pane_current_path}'"

# Shift + Alt + 0..9: Move current window to that number if unoccupied
bind -n "M-!" if-shell -F "#{!=:#{window_index},1}" "move-window -t :1"
bind -n "M-@" if-shell -F "#{!=:#{window_index},2}" "move-window -t :2"
bind -n "M-#" if-shell -F "#{!=:#{window_index},3}" "move-window -t :3"
bind -n "M-$" if-shell -F "#{!=:#{window_index},4}" "move-window -t :4"
bind -n "M-%" if-shell -F "#{!=:#{window_index},5}" "move-window -t :5"
bind -n "M-^" if-shell -F "#{!=:#{window_index},6}" "move-window -t :6"
bind -n "M-&" if-shell -F "#{!=:#{window_index},7}" "move-window -t :7"
bind -n "M-*" if-shell -F "#{!=:#{window_index},8}" "move-window -t :8"
bind -n "M-(" if-shell -F "#{!=:#{window_index},9}" "move-window -t :9"
bind -n "M-)" if-shell -F "#{!=:#{window_index},0}" "move-window -t :0"

# Extended keys / kitty keyboard protocol support for Shift + Alt + 0..9
bind -n M-S-1 if-shell -F "#{!=:#{window_index},1}" "move-window -t :1"
bind -n M-S-2 if-shell -F "#{!=:#{window_index},2}" "move-window -t :2"
bind -n M-S-3 if-shell -F "#{!=:#{window_index},3}" "move-window -t :3"
bind -n M-S-4 if-shell -F "#{!=:#{window_index},4}" "move-window -t :4"
bind -n M-S-5 if-shell -F "#{!=:#{window_index},5}" "move-window -t :5"
bind -n M-S-6 if-shell -F "#{!=:#{window_index},6}" "move-window -t :6"
bind -n M-S-7 if-shell -F "#{!=:#{window_index},7}" "move-window -t :7"
bind -n M-S-8 if-shell -F "#{!=:#{window_index},8}" "move-window -t :8"
bind -n M-S-9 if-shell -F "#{!=:#{window_index},9}" "move-window -t :9"
bind -n M-S-0 if-shell -F "#{!=:#{window_index},0}" "move-window -t :0"

# Cycle windows with Shift + Left/Right
bind -n S-Left  previous-window
bind -n S-Right next-window
