# DO NOT EDIT THIS FILE, EDIT ~/hakuspace-control/mango-custom.conf INSTEAD

exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP MANGO_INSTANCE_SIGNATURE
exec-once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP MANGO_INSTANCE_SIGNATURE
exec-once=systemctl --user --no-block start nixos-fake-graphical-session.target hypridle.service awww-daemon.service
exec-once=$HOME/.local/bin/polkit_start.sh
# exec-once=awww-daemon # Managed by systemd user service (awww-daemon.service)
exec-once=swaync
# exec-once=hypridle # Managed by systemd user service (hypridle.service)
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store
exec-once=nm-applet --indicator
exec-once=blueman-applet
exec-once=$HOME/.local/bin/dockbar_manager.sh --startup # Run dockbar if state is true
exec-once=$HOME/.local/bin/desktop_icons_manager.sh --startup # Run desktop icons if state is true
exec-once=$HOME/.local/bin/random_wallpaper.sh # Set wallpaper on startup
exec-once=$HOME/.local/bin/waybar_manager.sh --startup # Run waybar on startup with saved theme (no randomizing)
exec-once=$HOME/.local/bin/welcome.sh