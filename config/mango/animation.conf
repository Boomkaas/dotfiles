# Master Animation Configuration for MangoWM

animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=0
zoom_initial_ratio=0.88
zoom_end_ratio=0.88
fadein_begin_opacity=0.0
fadeout_begin_opacity=1.0

# Durations (ms) - Snappy, responsive, modern
animation_duration_move=280
animation_duration_open=280
animation_duration_tag=300
animation_duration_close=180
animation_duration_focus=250

# Modern Ease-Out Deceleration Curve (smooth landing, immediate onset)
animation_curve_open=0.05,0.9,0.1,1.0
animation_curve_move=0.05,0.9,0.1,1.0
animation_curve_tag=0.05,0.9,0.1,1.0
animation_curve_close=0.05,0.9,0.1,1.0
animation_curve_focus=0.05,0.9,0.1,1.0
animation_curve_opafadeout=0.05,0.9,0.1,1.0
animation_curve_opafadein=0.05,0.9,0.1,1.0