# DO NOT EDIT THIS FILE, EDIT ~/hakuspace-control/mango-custom.conf INSTEAD

# Hotkey Bindings
bind=SUPER+ALT,R,reload_config
bind=SUPER+SHIFT,E,quit

# Custom Application Bindings
bind=SUPER,Q,spawn,kitty
bind=SUPER+SHIFT,Q,spawn,kitty --start-as=fullscreen tmux
bind=SUPER,R,spawn,antigravity-ide
bind=SUPER,X,spawn,/home/peng/.local/bin/waybar_manager.sh --toggle
bind=SUPER,B,spawn,firefox
bind=SUPER,C,killclient,
bind=SUPER,E,spawn,thunar
bind=SUPER,N,spawn,swaync-client -t -sw
bind=SUPER,M,spawn,/home/peng/.local/bin/lock.sh
bind=SUPER,K,spawn,/home/peng/.local/bin/lock.sh

bind=SUPER,P,spawn,/home/peng/.local/bin/screenshot.sh
bind=SUPER+SHIFT,P,spawn,/home/peng/.local/bin/screenshot.sh --fullscreen
bind=SUPER+CTRL+SHIFT,P,spawn,/home/peng/.local/bin/record.sh

bind=SUPER,TAB,spawn,rofi -show drun
bind=SUPER+SHIFT,TAB,spawn,rofi -show Processes
bind=SUPER+SHIFT,Y,spawn,/home/peng/.local/bin/wallpaper_video_select.sh
bind=SUPER+SHIFT,V,spawn,/home/peng/.local/bin/clipboard_menu.sh --wipe
bind=SUPER,V,spawn,/home/peng/.local/bin/clipboard_menu.sh
bind=SUPER,Y,spawn,/home/peng/.local/bin/wallpaper_select.sh
bind=SUPER,F11,spawn,/home/peng/.local/bin/record.sh
bind=SUPER+ALT,C,spawn,/home/peng/.local/bin/waybar_manager.sh --cycle
bind=SUPER+ALT,B,spawn,/home/peng/.local/bin/dockbar_manager.sh --toggle 
bind=SUPER,L,spawn,/home/peng/.local/bin/nightlight_toggle.sh
bind=SUPER,T,spawn,telegram-desktop

bind=SUPER,SLASH,spawn,rofi -modi emoji -show emoji

# switch window status
bind=SUPER,G,toggleglobal,
bind=ALT,TAB,toggleoverview,0
bind=SUPER,Z,togglefloating,
bind=SUPER+SHIFT,F,togglemaximizescreen,
bind=SUPER+CTRL+SHIFT,F,togglefullscreen,
bind=ALT+SHIFT,F,togglefakefullscreen,
bind=SUPER,O,toggleoverlay,

# Scratchpad
bind=SUPER,I,minimized
bind=SUPER,GRAVE,toggle_scratchpad
bind=SUPER+SHIFT,I,restore_minimized

# ==============================================================================
# WINDOW FOCUS & NAVIGATION (WASD + ARROWS)
# ==============================================================================
# Focus Windows Left / Right
bind=SUPER,A,focusdir,left
bind=SUPER,D,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right

# Desktop / Workspace Navigation (W = Prev Desktop, S = Next Desktop)
bind=SUPER,W,viewtoleft,0
bind=SUPER,S,viewtoright,0
bind=SUPER,Up,viewtoleft,0
bind=SUPER,Down,viewtoright,0

# Move Window to Prev / Next Desktop
bind=SUPER+SHIFT,W,tagtoleft,0
bind=SUPER+SHIFT,S,tagtoright,0
bind=SUPER+SHIFT,Up,tagtoleft,0
bind=SUPER+SHIFT,Down,tagtoright,0

# Swap Windows
bind=ALT+SHIFT,W,exchange_client,up
bind=ALT+SHIFT,S,exchange_client,down
bind=ALT+SHIFT,A,exchange_client,left
bind=ALT+SHIFT,D,exchange_client,right
bind=ALT+SHIFT,Up,exchange_client,up
bind=ALT+SHIFT,Down,exchange_client,down
bind=ALT+SHIFT,Left,exchange_client,left
bind=ALT+SHIFT,Right,exchange_client,right

bind=SUPER+SHIFT,A,exchange_client,left
bind=SUPER+SHIFT,D,exchange_client,right

# Scroller Layout
bind=SUPER,F,switch_proportion_preset,
bind=SUPER+CTRL,A,scroller_stack,left
bind=SUPER+CTRL,D,scroller_stack,right
bind=SUPER+CTRL,W,scroller_stack,up
bind=SUPER+CTRL,S,scroller_stack,down
bind=SUPER+CTRL,Left,scroller_stack,left
bind=SUPER+CTRL,Right,scroller_stack,right
bind=SUPER+CTRL,Up,scroller_stack,up
bind=SUPER+CTRL,Down,scroller_stack,down

# Resize Window (Arrows only, freeing Ctrl+Alt+WASD for terminal apps & Neovim)
# bind=CTRL+ALT,W,resizewin,+0,-50
# bind=CTRL+ALT,S,resizewin,+0,+50
# bind=CTRL+ALT,A,resizewin,-50,+0
# bind=CTRL+ALT,D,resizewin,+50,+0
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Tag / Workspace Direct Switching
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Monitor Switch (WASD + Arrows)
bind=SUPER+ALT+CTRL,A,focusmon,left
bind=SUPER+ALT+CTRL,D,focusmon,right
bind=SUPER+ALT+CTRL,W,focusmon,up
bind=SUPER+ALT+CTRL,S,focusmon,down
bind=SUPER+ALT+CTRL,Left,focusmon,left
bind=SUPER+ALT+CTRL,Right,focusmon,right
bind=SUPER+ALT+CTRL,Up,focusmon,up
bind=SUPER+ALT+CTRL,Down,focusmon,down

bind=SUPER+ALT,A,tagmon,left
bind=SUPER+ALT,D,tagmon,right
bind=SUPER+ALT,W,tagmon,up
bind=SUPER+ALT,S,tagmon,down
bind=SUPER+ALT,Left,tagmon,left
bind=SUPER+ALT,Right,tagmon,right
bind=SUPER+ALT,Up,tagmon,up
bind=SUPER+ALT,Down,tagmon,down

# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER+CTRL,btn_middle,togglefullscreen

# Axis Bindings
axisbind=SUPER,UP,viewtoleft,0
axisbind=SUPER,DOWN,viewtoright,0
axisbind=SUPER+SHIFT,UP,focusdir,left
axisbind=SUPER+SHIFT,DOWN,focusdir,right
axisbind=CTRL+SUPER,UP,exchange_client,left
axisbind=CTRL+SUPER,DOWN,exchange_client,right

# Gesturebind
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview,1
gesturebind=none,down,4,toggleoverview,1

# Brightness and Volume
bind=none,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bind=none,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=none,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=none,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=none,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=none,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
bind=none,XF86AudioPlay,spawn,playerctl play-pause
bind=none,XF86AudioNext,spawn,playerctl next
bind=none,XF86AudioPrev,spawn,playerctl previous
bind=none,XF86PowerOff,spawn,/home/peng/.local/bin/lock.sh && systemctl suspend
bind=none,XF86Sleep,spawn,/home/peng/.local/bin/lock.sh && systemctl suspend
